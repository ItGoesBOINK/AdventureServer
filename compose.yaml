services:
    database:
        image: mysql:8.4
        restart: unless-stopped
        environment:
          MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
          MYSQL_DATABASE: ${MYSQL_DATABASE}
          MYSQL_USER: ${MYSQL_USER}
          MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        ports:
          - "3306:3306"
        volumes:
          - mysql_data:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin:latest
        restart: unless-stopped
        environment:
          PMA_HOST: database
          PMA_PORT: 3306
        ports:
          - "8080:80"

volumes:
  mysql_data:
